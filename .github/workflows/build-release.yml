name: Build & Release MIPS Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tool:
        description: 'Select tool to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - remote
          - stremio
          - micropython

permissions:
  contents: write

jobs:
  build-mips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Setup Musl MIPS Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl build-essential zip
          
          echo "[*] Downloading musl MIPSEL cross toolchain..."
          TOOLCHAIN_URLS=(
            "https://musl.cc/mipsel-linux-muslsf-cross.tgz"
            "https://more.musl.cc/10.2.1/x86_64-linux-musl/mipsel-linux-muslsf-cross.tgz"
          )
          
          DOWNLOAD_SUCCESS=false
          for url in "${TOOLCHAIN_URLS[@]}"; do
            echo "Attempting download from: $url"
            if curl -fSL --connect-timeout 20 --max-time 180 --retry 3 -o /tmp/toolchain.tgz "$url"; then
              DOWNLOAD_SUCCESS=true
              break
            fi
          done
          
          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "[!] Failed to download musl cross toolchain"
            exit 1
          fi
          
          sudo tar -xf /tmp/toolchain.tgz -C /opt
          export PATH="/opt/mipsel-linux-muslsf-cross/bin:$PATH"
          mipsel-linux-muslsf-gcc --version

      - name: Build Selected Tool(s)
        run: |
          chmod +x toolchain/build.sh
          ./toolchain/build.sh ${{ github.event.inputs.tool || 'all' }}

      - name: Package Release Assets
        run: |
          mkdir -p dist
          cp bootstrap/start_app.sh dist/
          cd dist
          tar -czf ../pch-toolkit-mipsel.tar.gz *
          cd ..
          
          mkdir -p usb_dist
          cp dist/bin/* usb_dist/ 2>/dev/null || true
          cp bootstrap/start_app.sh usb_dist/
          zip -r pch-revive-usb.zip usb_dist/*

      - name: Create GitHub Release / Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            pch-toolkit-mipsel.tar.gz
            pch-revive-usb.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts (CI Run)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: pch-binaries-${{ github.event.inputs.tool || 'all' }}
          path: dist/bin/*
